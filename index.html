<!-- 本地上传字体（主播女孩重度依赖同款像素 / 点阵 / 圆体）-->

  @font-face { font-family: 'BestTen CRT'; src: url('fonts/BestTen-CRT.otf') format('opentype'); font-display: swap; }
  @font-face { font-family: 'BestTen DOT'; src: url('fonts/BestTen-DOT.otf') format('opentype'); font-display: swap; }

<!-- 存档注入位：导出分享文件时会把状态写进这里 -->
<!-- __ALBUM_STATE_SLOT__ -->

<style>
  :root {
    --primary: #ee5ec0;
    --secondary: #5e3c88;
    --window-bg: #1e1531;
    --window-text: #e9cee6;
    --bg-1: #181124;
    --bg-2: #261b38;
    --gold: #ffcf4d;
    --live: #ff3b6b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ui-font: 'VT323', ui-monospace, 'PingFang SC', 'Microsoft YaHei', monospace;
    --latin-font: 'BestTen CRT', 'Press Start 2P', monospace;
    --stage-font: 'BestTen CRT', 'Noto Sans SC', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-1);
    color: var(--window-text);
    font-family: var(--ui-font);
    overflow: hidden;
    -webkit-font-smoothing: none;
    overscroll-behavior: none;
  }
  #root { height: 100%; }
  .latin { font-family: var(--latin-font); }

  /* checker background */
  .nso-checker {
    background-color: var(--bg-1);
    background-image:
      linear-gradient(45deg, var(--bg-2) 25%, transparent 25%, transparent 75%, var(--bg-2) 75%, var(--bg-2)),
      linear-gradient(45deg, var(--bg-2) 25%, transparent 25%, transparent 75%, var(--bg-2) 75%, var(--bg-2));
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
  }

  /* pixel borders */
  .nso-border {
    border: 4px solid var(--primary);
    box-shadow: inset 0 0 0 2px var(--window-bg), 6px 6px 0 var(--secondary), -4px -4px 0 var(--primary);
    background: var(--window-bg);
  }
  .nso-border-sm {
    border: 3px solid #000;
    box-shadow: 3px 3px 0 var(--primary);
    background: var(--window-bg);
  }
  .nso-header {
    background: var(--primary);
    color: var(--window-bg);
    padding: 6px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border-bottom: 4px solid #000;
    font-weight: 700; letter-spacing: 2px;
    font-size: 18px;
  }

  /* buttons */
  .nso-btn {
    border: 3px solid #000; background: var(--primary); color: var(--window-bg);
    font-family: var(--ui-font);
    font-weight: 700; padding: 8px 14px; cursor: pointer; font-size: 18px;
    box-shadow: 3px 3px 0 var(--secondary); letter-spacing: 1px;
    user-select: none;
  }
  .nso-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--secondary); }
  .nso-btn.ghost { background: var(--window-bg); color: var(--window-text); box-shadow: 3px 3px 0 var(--primary); }
  .nso-btn.ai { background: var(--secondary); color: #fff; }
  .nso-btn.gold { background: var(--gold); color: #4a2c00; box-shadow: 3px 3px 0 #b97e00; }
  .nso-btn.sm { font-size: 15px; padding: 5px 10px; box-shadow: 2px 2px 0 var(--secondary); }
  .nso-btn:disabled { opacity: .5; cursor: not-allowed; }

  .nso-input, .nso-textarea {
    border: 3px solid var(--window-text); background: var(--window-bg);
    color: var(--window-text); padding: 8px 10px; font-size: 18px; min-width: 0;
    font-family: var(--ui-font);
  }
  .nso-input::placeholder, .nso-textarea::placeholder { color: var(--window-text); opacity: .45; }
  .nso-textarea { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.5; resize: vertical; }

  /* scrollbars */
  .nso-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .nso-scroll::-webkit-scrollbar-thumb { background: var(--secondary); border: 1px solid #000; }
  .nso-scroll::-webkit-scrollbar-track { background: var(--bg-2); }

  /* danmaku */
  @keyframes nso-dm-fly { from { transform: translateX(var(--dm-from)); } to { transform: translateX(-100%); } }
  @keyframes nso-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes nso-pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
  @keyframes nso-blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes nso-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes nso-coinfall { 0%{transform:translateY(0) rotate(0);opacity:0} 12%{opacity:1} 100%{transform:translateY(115%) rotate(220deg);opacity:.9} }
  @keyframes nso-fanstoast { 0%{transform:translateY(8px) scale(.8);opacity:0} 20%{transform:translateY(0) scale(1);opacity:1} 80%{opacity:1} 100%{transform:translateY(-22px);opacity:0} }
  @keyframes nso-evcard { 0%{transform:scale(.6) rotate(-3deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
  @keyframes nso-spin { to { transform: rotate(360deg); } }

  .no-select { user-select: none; }

  /* shared across lobby + liveroom */
  .badge-live { background: var(--live); color:#fff; padding:3px 9px; font-weight:700; font-size:15px; letter-spacing:2px;
    display:flex; align-items:center; gap:6px; border:2px solid #000; animation: nso-pulse 1s infinite; }
  .badge-live .dot { width:8px; height:8px; background:#fff; border-radius:50%; }
  .stage-scan::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:8;
    background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,.10) 50%); background-size:100% 4px; }

  /* hide number spinners */
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
